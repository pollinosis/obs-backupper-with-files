name: Build Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Create config.json
      run: |
        echo '{"obs_config_path": null, "default_backup_dir": null, "last_used": null}' > config.json
    
    - name: Build GUI executable
      run: |
        pyinstaller --onefile --windowed --name "OBS-Backup-Tool" --add-data "config.json;." obs_backup_gui.py
    
    - name: Build CLI executable
      run: |
        pyinstaller --onefile --console --name "OBS-Backup-Tool-CLI" obs_backup_tool.py
    
    - name: Create Release Archive
      run: |
        mkdir release
        copy dist\OBS-Backup-Tool.exe release\
        copy dist\OBS-Backup-Tool-CLI.exe release\
        copy README.md release\
        copy config.json release\
        Compress-Archive -Path release\* -DestinationPath OBS-Backup-Tool-Windows.zip
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/OBS-Backup-Tool.exe
          dist/OBS-Backup-Tool-CLI.exe
          OBS-Backup-Tool-Windows.zip

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Create config.json
      run: |
        echo '{"obs_config_path": null, "default_backup_dir": null, "last_used": null}' > config.json
    
    - name: Build GUI executable
      run: |
        pyinstaller --onefile --windowed --name "OBS-Backup-Tool" --add-data "config.json:." obs_backup_gui.py
    
    - name: Build CLI executable
      run: |
        pyinstaller --onefile --console --name "OBS-Backup-Tool-CLI" obs_backup_tool.py
    
    - name: Create DMG
      run: |
        mkdir release
        cp -r dist/OBS-Backup-Tool.app release/ 2>/dev/null || cp dist/OBS-Backup-Tool release/
        cp dist/OBS-Backup-Tool-CLI release/
        cp README.md release/
        hdiutil create -volname "OBS Backup Tool" -srcfolder release -ov -format UDZO OBS-Backup-Tool-macOS.dmg
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: OBS-Backup-Tool-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Create config.json
      run: |
        echo '{"obs_config_path": null, "default_backup_dir": null, "last_used": null}' > config.json
    
    - name: Build executables
      run: |
        pyinstaller --onefile --name "obs-backup-tool-gui" --add-data "config.json:." obs_backup_gui.py
        pyinstaller --onefile --console --name "obs-backup-tool-cli" obs_backup_tool.py
    
    - name: Create tar.gz archive
      run: |
        mkdir release
        cp dist/obs-backup-tool-gui release/
        cp dist/obs-backup-tool-cli release/
        cp README.md release/
        cp config.json release/
        tar -czf OBS-Backup-Tool-Linux.tar.gz -C release .
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-build
        path: OBS-Backup-Tool-Linux.tar.gz

  create-release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    
    - name: Display structure of downloaded files
      run: ls -la artifacts/*
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/windows-build/OBS-Backup-Tool.exe
          artifacts/windows-build/OBS-Backup-Tool-CLI.exe
          artifacts/windows-build/OBS-Backup-Tool-Windows.zip
          artifacts/macos-build/OBS-Backup-Tool-macOS.dmg
          artifacts/linux-build/OBS-Backup-Tool-Linux.tar.gz
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## OBS Backup Tool v${{ github.ref_name }}
          
          ### ダウンロード
          - **Windows**: `OBS-Backup-Tool.exe` (GUI版) または `OBS-Backup-Tool-Windows.zip` (全ファイル)
          - **macOS**: `OBS-Backup-Tool-macOS.dmg`
          - **Linux**: `OBS-Backup-Tool-Linux.tar.gz`
          
          ### 主な機能
          - OBS設定の完全バックアップ（画像ファイル含む）
          - GUI/CLIの両対応
          - カスタムOBS設定パスのサポート
        token: ${{ secrets.GITHUB_TOKEN }}