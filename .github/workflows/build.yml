name: Build Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build GUI executable
      run: |
        pyinstaller --onefile --windowed --name "OBS-Backup-Tool" --icon "icon.ico" --add-data "config.json;." obs_backup_gui.py
    
    - name: Build CLI executable
      run: |
        pyinstaller --onefile --console --name "OBS-Backup-Tool-CLI" --icon "icon.ico" obs_backup_tool.py
    
    - name: Create Release Archive
      run: |
        mkdir release
        copy dist\OBS-Backup-Tool.exe release\
        copy dist\OBS-Backup-Tool-CLI.exe release\
        copy README.md release\
        copy config.json release\
        Compress-Archive -Path release\* -DestinationPath OBS-Backup-Tool-Windows.zip
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: windows-executable
        path: |
          dist/OBS-Backup-Tool.exe
          dist/OBS-Backup-Tool-CLI.exe
          OBS-Backup-Tool-Windows.zip
    
    # Create Release when tagged
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          OBS-Backup-Tool-Windows.zip
          dist/OBS-Backup-Tool.exe
          dist/OBS-Backup-Tool-CLI.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build GUI executable
      run: |
        pyinstaller --onefile --windowed --name "OBS-Backup-Tool" --icon "icon.icns" --add-data "config.json:." obs_backup_gui.py
    
    - name: Build CLI executable
      run: |
        pyinstaller --onefile --console --name "OBS-Backup-Tool-CLI" obs_backup_tool.py
    
    - name: Create DMG
      run: |
        mkdir release
        cp -r dist/OBS-Backup-Tool.app release/
        cp dist/OBS-Backup-Tool-CLI release/
        cp README.md release/
        hdiutil create -volname "OBS Backup Tool" -srcfolder release -ov -format UDZO OBS-Backup-Tool-macOS.dmg
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: macos-executable
        path: |
          OBS-Backup-Tool-macOS.dmg
    
    # Create Release when tagged
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: OBS-Backup-Tool-macOS.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
    
    - name: Build executables
      run: |
        pyinstaller --onefile --name "obs-backup-tool-gui" --add-data "config.json:." obs_backup_gui.py
        pyinstaller --onefile --console --name "obs-backup-tool-cli" obs_backup_tool.py
    
    - name: Create tar.gz archive
      run: |
        mkdir release
        cp dist/obs-backup-tool-gui release/
        cp dist/obs-backup-tool-cli release/
        cp README.md release/
        cp config.json release/
        tar -czf OBS-Backup-Tool-Linux.tar.gz -C release .
    
    - name: Upload Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: linux-executable
        path: |
          OBS-Backup-Tool-Linux.tar.gz
    
    # Create Release when tagged
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: OBS-Backup-Tool-Linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}